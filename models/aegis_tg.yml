# ==============================================================================
# AegisTG: Official Configuration (Anonymous Submission for ICIG 2026)
# ==============================================================================

__include__: [
  '../base/backbone_base.yml',
  '../dataset/industrial_logistics_dataset.yml',
  '../base/detection_base.yml'
]

output_dir: ./outputs/AegisTG_workspace
checkpoint_freq: 40

model: AegisTG

AegisTG:
  yaml_path: configs/aegis_tg_arch.yaml
  img_dim: 128


# [Note]: Optimizer and Scheduler details are simplified for review purposes.
# Full hyperparameter configurations will be provided upon acceptance.
optimizer:
  type: AdamW
  lr: 0.0008
  weight_decay: 0.0001
epoches: 160 

# ------------------------------------------------------------------------------
# Data Augmentation & Multimodal Inputs
# ------------------------------------------------------------------------------
train_dataloader: 
  total_batch_size: 4
  dataset: 
    transforms:
      ops: 
        - {type: Mosaic, probability: 1.0}
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: Resize, size: [640, 640]}
        - {type: ModalStack}                          # Core: Stacks RGB and Depth inputs
        - {type: ConvertBoxes, fmt: 'cxcywh'}
        - {type: RandomLoadTexts, num_classes: 5}     # Core: Loads textual instructions
        - {type: LookupTextFeats}                     # Core: Encodes text embeddings

# ------------------------------------------------------------------------------
# AegisTG Network Architecture 
# ------------------------------------------------------------------------------
backbone:
  - [-1, IdentityInput, []]                          
  - [-1, ModalitySelector, [1]]                        
  - [-1, StemBlock, [16, 16, True]]                     
  - [-1, HG_Stage, [16, 32, 1, 3, False, False, 3, True, 'se']] 
  - [-1, HG_Stage, [32, 128, 1, 3, True, False, 3, True, 'se']] 
  - [-5, ModalitySelector, [2]]                         )
  - [-1, StemBlock, [16, 16, True]]                     
  - [-1, HG_Stage, [16, 32, 1, 3, False, False, 3, True, 'se']] 
  - [-1, HG_Stage, [32, 128, 1, 3, True, False, 3, True, 'se']]
  - [[-6, -2], RAAF, [32]]                          
  - [-1, SCDown, [32, 3, 2]]                           
  - [[-7, -3], RAAF, [128]]                            
  - [[-1, -2], Concat, []]                              
  - [-1, ConvNormLayer_fuse, [128, 1, 1]]               
  - [-1, HG_Stage, [32, 256, 2, 3, True, True, 5, True, 'se']]  
  - [-1, HG_Stage, [64, 512, 1, 3, True, True, 5, True, 'se']]  
encoder:
  - [-7, ConvNormLayer_fuse, [64, 1, 1]]     
  - [-3, ConvNormLayer_fuse, [128, 1, 1]]    
  - [-3, ConvNormLayer_fuse, [128, 1, 1]]       
  - [-1, OmniMixer, [128, 128]]   
  - [[-2, -1], SyncUpFuse, [128, 128]]      
  - [[-4, -1], SyncUpFuse, [128, 128]]      
  - [[-6, -1], SyncUpFuse, [64, 64]]          
  - [-1, SCDown, [64, 3, 4, 'silu']]   
  - [[-1, -3], Concat, []]             
  - [-1, Conv, [128, 1, 1]]                    
  - [-1, SCDown, [128, 3, 2, 'silu']]             
  - [[-1, -7], Concat, []]            
  - [-1, Conv, [128, 1, 1]]    
  - [-4, RepNCSPELAN4, [128, 256, 21, 1, False, 'silu']] 
  - [-1, TGAttn, [128]]                          
  - [-3, RepNCSPELAN4, [128, 256, 21, 1, False, 'silu']]
  - [-1, TGAttn, [128]]      
decoder:
  - [[-3, -1], AegisTGdecoder, {"feat_strides":[16, 32], "hidden_dim": 128, "num_levels": 2, "num_layers": 3, "dim_feedforward": 512}] 

